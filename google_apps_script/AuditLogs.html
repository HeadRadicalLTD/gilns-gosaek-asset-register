<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>감사로그 열람</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d8deea;--soft:#f5f7fb;--accent:#344054;--good:#067647;--bad:#b42318}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.shell{width:min(1320px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.hero,.card,.detail{border:1px solid rgba(216,222,234,.9);border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 14px 34px rgba(23,32,51,.08)}.hero{padding:28px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:var(--accent);font-weight:900;text-decoration:none}.eyebrow{margin:18px 0 7px;color:#667085;font-size:12px;font-weight:900;letter-spacing:.12em}h1{margin:0;font-size:clamp(32px,6vw,48px)}.hero p:last-child{color:var(--muted)}.notice{margin-top:14px;padding:13px;border-radius:12px;background:#f2f4f7;color:#475467;font-weight:700}.card{margin-top:16px;padding:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#fff;color:#344054;font-weight:900;cursor:pointer}.tab.active{background:var(--accent);color:#fff}.search{width:min(320px,100%);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;background:#fff}.count{margin:15px 0 8px;color:var(--muted);font-size:13px;font-weight:800}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#eef2f7;color:#344054;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#f0f5ff}.target{font-weight:850}.summary{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result{display:inline-flex;border-radius:999px;padding:4px 8px;background:#ecfdf3;color:var(--good);font-weight:900}.result.bad{background:#fef3f2;color:var(--bad)}.empty{padding:34px;color:var(--muted);text-align:center}.detail{display:none;margin-top:14px;padding:20px}.detail.show{display:block}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail h2{margin:0;font-size:20px}.close{border:0;background:var(--soft);border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:900}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.field{min-height:76px;padding:12px;border-radius:12px;background:var(--soft)}.field.wide{grid-column:span 3}.label{display:block;margin-bottom:7px;color:var(--muted);font-size:12px;font-weight:900}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.message{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#fff1f1;color:var(--bad)}.message.show{display:block}@media(max-width:760px){.hero,.card,.detail{padding:18px}.nav{flex-direction:column}.toolbar{align-items:stretch}.search{width:100%}.table-wrap{border:0;background:transparent;overflow:visible}table,thead,tbody,tr,td{display:block}table{min-width:0}thead{display:none}tbody{display:grid;gap:10px}tbody tr{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}td{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:6px 0;border:0}td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:900}.summary{max-width:none;white-space:normal}.detail-grid{grid-template-columns:1fr}.field.wide{grid-column:span 1}}
  </style>
</head>
<body data-admin-token="<?= adminToken ?>" data-web-app-url="<?= webAppUrl ?>" data-user-role="admin" data-current-module="audit">
  <?!= getSharedBackgroundHtml_() ?>
  <main class="shell">
    <header class="hero">
      <nav class="nav"><a href="<?= webAppUrl ?>?adminToken=<?= adminToken ?>" target="_top">통합 메뉴</a><strong><?= actorName ?> · <?= userRole === 'admin' ? '관리자' : '등록자' ?></strong></nav>
      <p class="eyebrow">READ ONLY AUDIT TRAIL</p><h1>감사로그 열람</h1>
      <p>누가, 언제, 어떤 업무에서 무엇을 처리했는지 읽기 쉽게 확인합니다. 읽기 전용 화면이므로 수정하거나 삭제할 수 없습니다.</p>
    </header>
    <div class="notice">업무별 최신 100건을 표시합니다. 행을 누르면 대상번호·처리유형·변경 전후 내용을 자세히 볼 수 있습니다.</div>
    <div id="errorMessage" class="message"></div>
    <section class="card">
      <div class="toolbar"><div id="tabs" class="tabs"></div><input id="search" class="search" type="search" placeholder="처리자·대상·처리내용 검색" aria-label="감사로그 검색"></div>
      <div id="count" class="count"></div><div id="table" class="table-wrap"><div class="empty">감사로그를 불러오는 중입니다.</div></div>
    </section>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>
  <script>
    const ADMIN_TOKEN=document.body.dataset.adminToken;
    gilnsProtectSessionUrl(ADMIN_TOKEN,{module:'audit'});
    const MAIN_HEADERS=['처리일시','처리자','업무','대상','처리내용','결과','사유·비고'];
    const DETAIL_HEADERS=['대상번호','처리유형','변경 전','변경 후'];
    const state={logs:[],selected:0,query:'',selectedRow:-1};
    document.getElementById('search').addEventListener('input',(event)=>{state.query=event.target.value.trim().toLowerCase();state.selectedRow=-1;hideDetail();renderTable();});
    function load(){google.script.run.withSuccessHandler((config)=>{if(!config.ok){showError(config.message);return;}state.logs=config.logs||[];renderTabs();renderTable();}).withFailureHandler((e)=>showError(e&&e.message?e.message:String(e))).getAuditLogConfig(ADMIN_TOKEN);}
    function renderTabs(){const target=document.getElementById('tabs');target.innerHTML=state.logs.map((log,index)=>'<button class="tab '+(index===state.selected?'active':'')+'" type="button" data-index="'+index+'">'+escapeHtml(log.name)+' ('+(log.rows||[]).length+')</button>').join('');target.querySelectorAll('.tab').forEach((button)=>button.addEventListener('click',()=>{state.selected=Number(button.dataset.index);state.selectedRow=-1;hideDetail();renderTabs();renderTable();}));}
    function selectedLog(){return state.logs[state.selected]||null;}
    function headerMap(log){return (log.headers||[]).reduce((map,header,index)=>{map[String(header).trim()]=index;return map;},{});}
    function cell(row,map,header){const index=map[header];return index==null?'':row[index];}
    function visibleRows(log){const query=state.query;if(!query)return (log.rows||[]).map((row,index)=>({row,index}));return (log.rows||[]).map((row,index)=>({row,index})).filter((item)=>item.row.some((value)=>String(value==null?'':value).toLowerCase().includes(query)));}
    function renderTable(){const target=document.getElementById('table');const count=document.getElementById('count');const log=selectedLog();if(!log){count.textContent='';target.innerHTML='<div class="empty">표시할 로그가 없습니다.</div>';return;}const map=headerMap(log);const rows=visibleRows(log);count.textContent='검색 결과 '+rows.length+'건 · 전체 '+(log.rows||[]).length+'건';if(!rows.length){target.innerHTML='<div class="empty">조건에 맞는 로그가 없습니다.</div>';return;}target.innerHTML='<table><thead><tr>'+MAIN_HEADERS.map((header)=>'<th>'+escapeHtml(header)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((item)=>'<tr data-index="'+item.index+'" class="'+(item.index===state.selectedRow?'selected':'')+'">'+MAIN_HEADERS.map((header)=>{const value=cell(item.row,map,header);const classes=header==='대상'?'target':header==='처리내용'?'summary':'';const shown=header==='결과'?'<span class="result '+(isBadResult(value)?'bad':'')+'">'+escapeHtml(value||'-')+'</span>':escapeHtml(value||'-');return '<td class="'+classes+'" data-label="'+escapeHtml(header)+'">'+shown+'</td>';}).join('')+'</tr>').join('')+'</tbody></table>';target.querySelectorAll('tbody tr').forEach((row)=>row.addEventListener('click',()=>showDetail(Number(row.dataset.index))));}
    function showDetail(index){const log=selectedLog();if(!log||!log.rows[index])return;state.selectedRow=index;renderTable();const row=log.rows[index],map=headerMap(log),detail=document.getElementById('detail');const title=cell(row,map,'대상')||cell(row,map,'대상번호')||'상세 기록';const fields=[...MAIN_HEADERS,...DETAIL_HEADERS];detail.innerHTML='<div class="detail-head"><div><span class="label">선택한 감사기록</span><h2>'+escapeHtml(title)+'</h2></div><button class="close" type="button">닫기</button></div><div class="detail-grid">'+fields.map((header)=>'<div class="field '+(['처리내용','변경 전','변경 후'].includes(header)?'wide':'')+'"><span class="label">'+escapeHtml(header)+'</span><div class="value">'+escapeHtml(cell(row,map,header)||'-')+'</div></div>').join('')+'</div>';detail.classList.add('show');detail.querySelector('.close').addEventListener('click',hideDetail);detail.scrollIntoView({behavior:'smooth',block:'nearest'});}
    function hideDetail(){const detail=document.getElementById('detail');detail.classList.remove('show');detail.innerHTML='';}
    function isBadResult(value){return /실패|오류|거절|취소|반려/.test(String(value||''));}
    function showError(text){const element=document.getElementById('errorMessage');element.textContent=text;element.classList.add('show');}
    function escapeHtml(text){return String(text==null?'':text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
    load();
  </script>
</body>
</html>
