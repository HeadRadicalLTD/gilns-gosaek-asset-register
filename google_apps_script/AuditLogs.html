<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>감사로그 열람</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d8deea;--accent:#344054;--red:#c43232}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.shell{width:min(1240px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.hero,.card{border:1px solid rgba(216,222,234,.9);border-radius:22px;background:rgba(255,255,255,.95);box-shadow:0 14px 34px rgba(23,32,51,.08)}.hero{padding:28px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:var(--accent);font-weight:900;text-decoration:none}.eyebrow{margin:18px 0 7px;color:#667085;font-size:12px;font-weight:900;letter-spacing:.12em}h1{margin:0;font-size:clamp(32px,6vw,48px)}.hero p:last-child{color:var(--muted)}.notice{margin-top:14px;padding:13px;border-radius:12px;background:#f2f4f7;color:#475467;font-weight:700}.card{margin-top:16px;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#fff;color:#344054;font-weight:900;cursor:pointer}.tab.active{background:var(--accent);color:#fff}.table-wrap{margin-top:15px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;min-width:100%;font-size:12px}th,td{max-width:360px;padding:10px 11px;border-right:1px solid #eaecf0;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}th{position:sticky;top:0;background:#f2f4f7;color:#344054;white-space:nowrap}.empty{padding:30px;color:var(--muted);text-align:center}.message{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#fff1f1;color:var(--red)}.message.show{display:block}@media(max-width:600px){.hero,.card{padding:18px}.nav{flex-direction:column}}
  </style>
</head>
<body data-admin-token="<?= adminToken ?>" data-web-app-url="<?= webAppUrl ?>" data-user-role="admin" data-current-module="audit">
  <?!= getSharedBackgroundHtml_() ?>
  <main class="shell"><header class="hero"><nav class="nav"><a href="<?= webAppUrl ?>?adminToken=<?= adminToken ?>" target="_top">통합 메뉴</a><strong><?= actorName ?> · <?= userRole === 'admin' ? '관리자' : '등록자' ?></strong></nav><p class="eyebrow">READ ONLY AUDIT TRAIL</p><h1>감사로그 열람</h1><p>최근 기록을 읽기 전용으로 확인합니다. 이 화면에서는 수정하거나 삭제할 수 없습니다.</p></header><div class="notice">로그는 최신 100건까지 표시합니다. 원본 로그 시트는 프로그램만 추가 기록하도록 보호됩니다.</div><div id="errorMessage" class="message"></div><section class="card"><div id="tabs" class="tabs"></div><div id="table" class="table-wrap"><div class="empty">감사로그를 불러오는 중입니다.</div></div></section></main>
  <script>
    const ADMIN_TOKEN=document.body.dataset.adminToken;gilnsProtectSessionUrl(ADMIN_TOKEN,{module:'audit'});const state={logs:[],selected:0};function load(){google.script.run.withSuccessHandler((config)=>{if(!config.ok){error(config.message);return;}state.logs=config.logs||[];renderTabs();renderTable();}).withFailureHandler((e)=>error(e&&e.message?e.message:String(e))).getAuditLogConfig(ADMIN_TOKEN);}function renderTabs(){const target=document.getElementById('tabs');target.innerHTML=state.logs.map((log,index)=>'<button class="tab '+(index===state.selected?'active':'')+'" type="button" data-index="'+index+'">'+escapeHtml(log.name)+' ('+log.rows.length+')</button>').join('');target.querySelectorAll('.tab').forEach((button)=>button.addEventListener('click',()=>{state.selected=Number(button.dataset.index);renderTabs();renderTable();}));}function renderTable(){const target=document.getElementById('table');const log=state.logs[state.selected];if(!log||!log.rows.length){target.innerHTML='<div class="empty">표시할 로그가 없습니다.</div>';return;}target.innerHTML='<table><thead><tr>'+log.headers.map((h)=>'<th>'+escapeHtml(h)+'</th>').join('')+'</tr></thead><tbody>'+log.rows.map((row)=>'<tr>'+row.map((v)=>'<td>'+escapeHtml(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}function error(text){const e=document.getElementById('errorMessage');e.textContent=text;e.classList.add('show');}function escapeHtml(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}load();
  </script>
</body>
</html>
