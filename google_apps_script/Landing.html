<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>길앤에스 통합 관리</title>
  <style>
    :root {
      --navy: #17233c;
      --blue: #2f68dd;
      --muted: #60708d;
      --line: rgba(57, 86, 142, .17);
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      overflow-x: hidden;
      color: var(--navy);
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
      place-items: center;
    }

    .panel {
      position: relative;
      isolation: isolate;
      overflow: visible;
      width: min(100%, 960px);
      padding: clamp(30px, 5vw, 58px);
      border: 0;
      background: transparent;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #17233c;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: .04em;
    }

    .brand .company-logo {
      display: block;
      width: 42px;
      height: 45px;
      border-radius: 10px;
      object-fit: contain;
    }

    .eyebrow {
      margin: 34px 0 8px;
      color: rgba(23, 35, 60, .64);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 62px);
      letter-spacing: -.055em;
      line-height: 1.08;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 34px;
    }

    .choice {
      display: flex;
      min-height: 170px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 24px;
      background: rgba(255,255,255,.66);
      color: var(--navy);
      text-decoration: none;
      box-shadow: 0 13px 30px rgba(54, 66, 116, .13);
      backdrop-filter: blur(14px);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      flex-direction: column;
    }

    .choice:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,.84);
      box-shadow: 0 18px 40px rgba(54, 66, 116, .2);
    }

    .choice:focus-visible {
      outline: 4px solid rgba(47, 104, 221, .25);
      outline-offset: 3px;
    }

    .choice-head {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .icon {
      display: grid;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(47, 104, 221, .1);
      color: var(--blue);
      place-items: center;
    }

    .visitor .icon { background: rgba(18, 139, 102, .12); color: #087d5b; }
    .icon svg { width: 25px; height: 25px; }

    .choice h2 {
      margin: 18px 0 0;
      font-size: 24px;
      letter-spacing: -.04em;
    }

    .open {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: auto;
      padding-top: 19px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 900;
    }

    .visitor .open { color: #087d5b; }

    @media (max-width: 680px) {
      body { padding: 12px; align-items: start; }
      .panel { margin: 12px 0; padding: 28px 20px; }
      .eyebrow { margin-top: 28px; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 160px; padding: 21px; }
    }
  </style>
</head>
<body data-web-app-url="<?= webAppUrl ?>">
  <?!= getSharedBackgroundHtml_() ?>
  <main class="panel">
    <div class="brand" aria-label="길앤에스">
      <?!= getCompanyLogoHtml_() ?>
      <span>GIL&amp;S</span>
    </div>

    <p class="eyebrow">GILNS INTEGRATED MANAGEMENT</p>
    <h1>길앤에스 통합 관리</h1>

    <section class="choices" aria-label="시작 메뉴">
      <a class="choice visitor" href="<?= webAppUrl ?>?module=visitor&amp;mode=portal" target="_top">
        <div class="choice-head">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="10" cy="7" r="3.2"/><path d="M3.7 19c.5-4 2.6-6 6.3-6 2 0 3.6.6 4.7 1.8"/><path d="m15.5 18 2 2 3.5-4"/>
            </svg>
          </span>
        </div>
        <h2>외부 방문</h2>
        <span class="open">방문 신청·등록 열기 <span aria-hidden="true">→</span></span>
      </a>

      <a class="choice admin" href="<?= webAppUrl ?>?module=login" target="_top">
        <div class="choice-head">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1"/>
            </svg>
          </span>
        </div>
        <h2>로그인</h2>
        <span class="open">로그인 화면 열기 <span aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>
  <script>
    function warmNextScreens() {
      google.script.run
        .withFailureHandler(() => {})
        .warmPublicPages();
    }

    if ('requestIdleCallback' in window) {
      requestIdleCallback(warmNextScreens, { timeout: 1200 });
    } else {
      setTimeout(warmNextScreens, 350);
    }
  </script>
</body>
</html>
