<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>정보자산관리</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d8deea;--purple:#7656d8;--red:#c83a3a;--green:#16845b}
    *{box-sizing:border-box}body{margin:0;background:#f1f2f8;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .shell{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 64px}.hero{padding:30px;border-radius:24px;background:linear-gradient(135deg,#2a2445,#4e3b83);color:#fff;box-shadow:0 16px 38px rgba(42,36,69,.18)}
    .nav{display:flex;justify-content:space-between;gap:12px;margin-bottom:22px}.nav a{padding:8px 11px;border:1px solid rgba(255,255,255,.2);border-radius:9px;color:#fff;font-size:13px;font-weight:800;text-decoration:none}.eyebrow{margin:0 0 8px;color:#c8baff;font-size:12px;font-weight:900;letter-spacing:.12em}h1{margin:0;font-size:clamp(30px,5vw,46px);letter-spacing:-.04em}.hero p:last-child{margin:12px 0 0;color:#e3def5;line-height:1.6}
    .status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--muted);font-size:13px}.status a{color:var(--purple);font-weight:800}.notice{margin-top:14px;padding:13px 16px;border:1px solid #e0d6ff;border-radius:13px;background:#f8f5ff;color:#54417f;font-size:13px;font-weight:700}
    .card{margin-top:16px;padding:24px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(23,32,51,.05)}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.card h2{margin:0;font-size:22px}.card-head p{margin:7px 0 0;color:var(--muted);font-size:14px}.count{padding:8px 11px;border-radius:10px;background:#f0ecff;color:var(--purple);font-weight:900}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:7px;font-size:14px;font-weight:800}.required{color:var(--red)}input,select,textarea{width:100%;min-height:48px;padding:11px 13px;border:1px solid #cbd3e2;border-radius:11px;background:#fff;outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(118,86,216,.1)}.submit{width:100%;min-height:52px;margin-top:20px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:900;cursor:pointer}.submit:disabled{opacity:.45;cursor:not-allowed}
    .filters{display:flex;gap:10px;margin-bottom:14px}.filters input,.filters select{max-width:260px}.records{display:grid;gap:12px}.record{display:grid;grid-template-columns:110px 1.3fr 1fr 1fr 110px 80px;gap:12px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:14px}.record strong,.record span{min-width:0;overflow-wrap:anywhere}.record small{display:block;margin-top:4px;color:var(--muted);font-size:12px}.class{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0ecff;color:var(--purple);font-size:12px;font-weight:900}.edit-button,.cancel-edit{border:0;border-radius:9px;padding:9px 12px;background:#ede9fe;color:#5b3fc0;font-weight:900;cursor:pointer}.edit-controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.empty{padding:34px;border:1px dashed #cbd3e2;border-radius:14px;color:var(--muted);text-align:center}
    .message{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:14px}.message.show{display:block}.error{border:1px solid #efb8b8;background:#fff1f1;color:var(--red)}.success{border:1px solid #b7ddc8;background:#eef9f3;color:#0f6846}.overlay{display:none;position:fixed;z-index:20;inset:0;align-items:center;justify-content:center;background:rgba(23,32,51,.42);color:#fff;font-size:18px;font-weight:900}.overlay.show{display:flex}
    @media(max-width:820px){.record{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:560px){.record{grid-template-columns:1fr}.filters{flex-direction:column}.filters input,.filters select{max-width:none}.status{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body data-web-app-url="<?= webAppUrl ?>" data-admin-token="<?= adminToken ?>" data-user-role="<?= userRole ?>" data-actor-name="<?= actorName ?>" data-current-module="info">
  <?!= getSharedBackgroundHtml_() ?>
  <main class="shell">
    <header class="hero">
      <nav class="nav"><a href="<?= webAppUrl ?>?adminToken=<?= adminToken ?>" target="_top">통합 메뉴</a><a href="<?= webAppUrl ?>?module=asset&adminToken=<?= adminToken ?>" target="_top">실물자산관리</a></nav>
      <p class="eyebrow">INFORMATION ASSET MANAGEMENT</p><h1>정보자산관리</h1><p>장비·소프트웨어·서비스·계정·데이터의 책임자와 보안 상태를 관리합니다.</p>
    </header>
    <div class="notice">비밀번호, 인증키, 복구코드 등 실제 비밀값은 절대 입력하지 마세요. 계정은 계정명과 담당자만 기록합니다.</div>
    <div class="status"><span id="systemStatus">정보자산 대장 연결 확인 중</span><a id="ledgerLink" class="hidden" href="#" target="_blank">정보자산 대장 열기</a></div>
    <div id="errorMessage" class="message error"></div><div id="successMessage" class="message success"></div>

    <section class="card">
      <div class="card-head"><div><h2 id="formTitle">정보자산 등록</h2><p>등록 및 수정 시 정보자산 번호와 변경 불가 로그가 자동 생성됩니다.</p></div></div>
      <form id="assetForm">
        <div class="grid">
          <div class="field"><label for="category">분류 <span class="required">*</span></label><select id="category"><option value="">선택하세요</option></select></div>
          <div class="field"><label for="assetName">자산명 <span class="required">*</span></label><input id="assetName"></div>
          <div class="field"><label for="provider">제조사·서비스</label><input id="provider"></div>
          <div class="field"><label for="modelVersion">모델·버전</label><input id="modelVersion"></div>
          <div class="field"><label for="identifier">식별번호·계정명</label><input id="identifier"></div>
          <div class="field"><label for="location">설치 위치·접속주소</label><input id="location"></div>
          <div class="field"><label for="owner">담당자 <span class="required">*</span></label><input id="owner"></div>
          <div class="field"><label for="department">부서 <span class="required">*</span></label><input id="department"></div>
          <div class="field"><label for="securityClass">보안등급 <span class="required">*</span></label><select id="securityClass"><option value="">선택하세요</option></select></div>
          <div class="field"><label for="status">상태 <span class="required">*</span></label><select id="status"><option value="">선택하세요</option></select></div>
          <div class="field"><label for="introducedDate">도입일</label><input id="introducedDate" type="date"></div>
          <div class="field"><label for="expiryDate">만료일·갱신일</label><input id="expiryDate" type="date"></div>
          <div class="field"><label for="networkIdentifier">IP·MAC</label><input id="networkIdentifier"></div>
          <div class="field"><label for="personalData">개인정보 포함</label><select id="personalData"><option value="아니오">아니오</option><option value="예">예</option><option value="확인필요">확인필요</option></select></div>
          <div class="field full"><label for="remarks">비고</label><textarea id="remarks"></textarea></div>
        </div>
        <div id="editControls" class="edit-controls hidden"><input id="editReason" maxlength="300" placeholder="수정 사유를 입력하세요"><button id="cancelEditButton" class="cancel-edit" type="button">수정 취소</button></div>
        <button id="submitButton" class="submit" type="submit" disabled>정보자산 등록</button>
      </form>
    </section>

    <section class="card <?= userRole === 'admin' ? '' : 'hidden' ?>">
      <div class="card-head"><div><h2>정보자산 목록</h2><p>비밀번호와 인증키는 목록에 저장하지 않습니다.</p></div><span id="recordCount" class="count">00</span></div>
      <div class="filters"><input id="searchInput" placeholder="자산명·담당자·식별번호 검색"><select id="categoryFilter"><option value="">전체 분류</option></select></div>
      <div id="records" class="records"><div class="empty">정보자산 대장을 불러오는 중입니다.</div></div>
    </section>
  </main>
  <div id="overlay" class="overlay">처리 중입니다.</div>
  <script>
    const ADMIN_TOKEN=document.body.dataset.adminToken;
    gilnsProtectSessionUrl(ADMIN_TOKEN,{module:'info'});
    const USER_ROLE=document.body.dataset.userRole;
    const IS_ADMIN=USER_ROLE==='admin';
    const state={ready:false,busy:false,records:[],editAssetId:''};
    const form=document.getElementById('assetForm');
    form.addEventListener('input',updateButton);
    form.addEventListener('change',updateButton);
    form.addEventListener('submit',saveAsset);
    document.getElementById('cancelEditButton').addEventListener('click',resetForm);
    document.getElementById('searchInput').addEventListener('input',renderFiltered);
    document.getElementById('categoryFilter').addEventListener('change',renderFiltered);

    function loadConfig(){google.script.run.withSuccessHandler((config)=>{if(!config.ok){showError(config.message);return;}state.ready=true;document.getElementById('systemStatus').textContent='정보자산 대장 연결됨';const ledger=document.getElementById('ledgerLink');ledger.href=config.ledgerUrl;ledger.classList.toggle('hidden',!config.ledgerUrl);fillSelect('category',config.categories);fillSelect('securityClass',config.securityClasses);fillSelect('status',config.statuses);document.getElementById('categoryFilter').innerHTML='<option value="">전체 분류</option>'+config.categories.map(option).join('');state.records=config.records||[];renderFiltered();updateButton();}).withFailureHandler((error)=>showError(messageOf(error))).getInfoAssetConfig(ADMIN_TOKEN);}

    function payload(){return {adminToken:ADMIN_TOKEN,assetId:state.editAssetId,reason:value('editReason'),category:value('category'),assetName:value('assetName'),provider:value('provider'),modelVersion:value('modelVersion'),identifier:value('identifier'),owner:value('owner'),department:value('department'),location:value('location'),securityClass:value('securityClass'),status:value('status'),introducedDate:value('introducedDate'),expiryDate:value('expiryDate'),networkIdentifier:value('networkIdentifier'),personalData:value('personalData'),remarks:value('remarks')};}

    function saveAsset(event){event.preventDefault();if(!ready()||state.busy)return;if(state.editAssetId&&!value('editReason')){showError('수정 사유를 입력하세요.');return;}setBusy(true);clearMessages();const request=payload();const success=(result)=>{setBusy(false);showSuccess(result.assetId+' '+result.assetName+(state.editAssetId?' 수정 완료':' 등록 완료'));state.records=result.records||[];resetForm();renderFiltered();};const failure=(error)=>{setBusy(false);showError(messageOf(error));};const runner=google.script.run.withSuccessHandler(success).withFailureHandler(failure);if(state.editAssetId){runner.updateInfoAsset(request);}else{runner.registerInfoAsset(request);}}

    function startEdit(assetId){if(!IS_ADMIN)return;const record=state.records.find((item)=>item.assetId===assetId);if(!record)return;state.editAssetId=record.assetId;['category','assetName','provider','modelVersion','identifier','owner','department','location','securityClass','status','introducedDate','expiryDate','networkIdentifier','personalData','remarks'].forEach((id)=>{document.getElementById(id).value=record[id]||'';});document.getElementById('formTitle').textContent=record.assetId+' 정보자산 수정';document.getElementById('editControls').classList.remove('hidden');document.getElementById('submitButton').textContent='정보자산 수정';window.scrollTo({top:0,behavior:'smooth'});updateButton();}

    function resetForm(){form.reset();state.editAssetId='';document.getElementById('personalData').value='아니오';document.getElementById('formTitle').textContent='정보자산 등록';document.getElementById('editControls').classList.add('hidden');document.getElementById('editReason').value='';document.getElementById('submitButton').textContent='정보자산 등록';updateButton();}

    function renderFiltered(){const q=value('searchInput').toLowerCase();const category=value('categoryFilter');const records=state.records.filter((r)=>(!category||r.category===category)&&(!q||[r.assetId,r.assetName,r.owner,r.identifier,r.provider].join(' ').toLowerCase().includes(q)));document.getElementById('recordCount').textContent=String(records.length).padStart(2,'0');const target=document.getElementById('records');if(!records.length){target.innerHTML='<div class="empty">조건에 맞는 정보자산이 없습니다.</div>';return;}target.innerHTML=records.map((r)=>['<article class="record"><strong>',escapeHtml(r.assetId),'<small>',escapeHtml(r.category),'</small></strong><span>',escapeHtml(r.assetName),'<small>',escapeHtml(r.provider),' ',escapeHtml(r.modelVersion),'</small></span><span>',escapeHtml(r.owner),'<small>',escapeHtml(r.department),'</small></span><span>',escapeHtml(r.identifier),'<small>',escapeHtml(r.location),'</small></span><span class="class">',escapeHtml(r.securityClass),'<small>',escapeHtml(r.status),'</small></span>','<button class="edit-button" type="button" data-id="'+escapeHtml(r.assetId)+'">수정</button>','</article>'].join('')).join('');target.querySelectorAll('.edit-button').forEach((button)=>button.addEventListener('click',()=>startEdit(button.dataset.id)));}
    function fillSelect(id,values){document.getElementById(id).innerHTML='<option value="">선택하세요</option>'+values.map(option).join('');}
    function option(text){return '<option value="'+escapeHtml(text)+'">'+escapeHtml(text)+'</option>';}
    function ready(){return ['category','assetName','owner','department','securityClass','status'].every((id)=>value(id));}function updateButton(){document.getElementById('submitButton').disabled=state.busy||!state.ready||!ready()||(state.editAssetId&&!value('editReason'));}function setBusy(v){state.busy=v;clearTimeout(state.overlayTimer);const overlay=document.getElementById('overlay');if(v){state.overlayTimer=setTimeout(()=>overlay.classList.add('show'),350)}else{overlay.classList.remove('show')}updateButton();}function value(id){return document.getElementById(id).value.trim();}function clearMessages(){['errorMessage','successMessage'].forEach((id)=>document.getElementById(id).classList.remove('show'));}function showError(text){const e=document.getElementById('errorMessage');e.textContent=text;e.classList.add('show');}function showSuccess(text){const e=document.getElementById('successMessage');e.textContent=text;e.classList.add('show');}function messageOf(error){return error&&error.message?error.message:String(error||'처리 중 오류가 발생했습니다.');}function escapeHtml(text){return String(text==null?'':text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
    loadConfig();
  </script>
</body>
</html>
