<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>외부 방문객 현장 등록</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #14213d;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #eef4ff;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .shell {
      position: relative;
      z-index: 1;
      width: min(620px, calc(100% - 18px));
      margin: 0 auto;
      padding: 14px 0 42px;
    }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; }
    .brand .company-logo { width: 36px; height: 39px; object-fit: contain; border-radius: 8px; }
    .back { color: #334155; font-size: 13px; font-weight: 800; text-decoration: none; }
    .hero, .card {
      border: 1px solid rgba(255,255,255,.8);
      background: rgba(255,255,255,.86);
      box-shadow: 0 16px 48px rgba(31,51,92,.14);
      backdrop-filter: blur(16px);
    }
    .hero { padding: 25px 20px; border-radius: 22px; }
    .eyebrow { margin: 0 0 7px; color: #158b66; font-size: 11px; font-weight: 900; letter-spacing: .13em; }
    h1 { margin: 0; font-size: 30px; }
    .hero p:last-child { margin: 10px 0 0; color: #64748b; line-height: 1.55; }
    .status { display: flex; align-items: center; gap: 8px; margin: 12px 0; padding: 11px 13px; color: #64748b; font-size: 13px; font-weight: 800; border-radius: 13px; background: rgba(255,255,255,.78); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .dot.ready { background: #1aae75; box-shadow: 0 0 0 4px rgba(26,174,117,.12); }
    .card { margin-top: 12px; padding: 22px 18px; border-radius: 20px; }
    h2 { margin: 0 0 6px; font-size: 21px; }
    .intro { margin: 0 0 18px; color: #64748b; font-size: 14px; line-height: 1.55; }
    .field { margin-top: 14px; }
    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 900; }
    .required { color: #e11d48; }
    input {
      width: 100%;
      padding: 14px;
      color: #14213d;
      border: 1px solid #cbd8ec;
      border-radius: 12px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #158b66; box-shadow: 0 0 0 3px rgba(21,139,102,.12); }
    .submit {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      color: #fff;
      font-weight: 900;
      border: 0;
      border-radius: 13px;
      background: #158b66;
    }
    .submit:disabled { cursor: not-allowed; background: #b8c5da; }
    .message { display: none; margin-top: 12px; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 800; line-height: 1.5; }
    .message.error { display: block; color: #b91c1c; border: 1px solid #fecaca; background: #fff1f2; }
    .message.success { display: block; color: #087d5b; border: 1px solid #a7f3d0; background: #ecfdf5; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 16px; }
    .details div { min-height: 70px; padding: 12px; border-radius: 11px; background: #f7f9fd; }
    .details small { display: block; margin-bottom: 4px; color: #64748b; }
    .details strong { line-height: 1.45; word-break: break-word; }
    .check { display: flex; align-items: flex-start; gap: 10px; margin-top: 18px; padding: 14px; border-radius: 12px; background: #ecfdf5; font-size: 14px; font-weight: 800; line-height: 1.5; }
    .check input { width: auto; margin-top: 3px; }
    .security-copy { margin-top: 10px; padding: 13px; color: #475569; font-size: 13px; line-height: 1.55; border-left: 4px solid #158b66; background: #f8fafc; }
    .success-icon { display: grid; width: 58px; height: 58px; margin: 0 auto 14px; place-items: center; color: #fff; font-size: 28px; border-radius: 50%; background: #1aae75; }
    .success-card { text-align: center; }
    .overlay { display: none; position: fixed; inset: 0; z-index: 20; place-items: center; color: #fff; font-weight: 900; background: rgba(15,23,42,.58); }
    .overlay.show { display: grid; }
    @media (max-width: 480px) {
      .details { grid-template-columns: 1fr; }
      .hero, .card { border-radius: 18px; }
    }
  </style>
</head>
<body data-web-app-url="<?= webAppUrl ?>">
  <?!= getSharedBackgroundHtml_() ?>
  <main class="shell">
    <div class="top">
      <div class="brand"><?!= getCompanyLogoHtml_() ?><span>GIL&amp;S</span></div>
      <a class="back" href="<?= webAppUrl ?>?module=visitor&amp;mode=portal" target="_top">방문 안내로</a>
    </div>
    <header class="hero">
      <p class="eyebrow">VISITOR CHECK-IN</p>
      <h1>방문객 현장 등록</h1>
      <p>승인된 방문 신청의 성명과 본인 연락처가 일치해야 입장할 수 있습니다.</p>
    </header>

    <div class="status"><span id="statusDot" class="dot"></span><span id="systemStatus">등록 시스템 연결 확인 중</span></div>
    <div id="message" class="message"></div>

    <section id="lookupCard" class="card">
      <h2>승인 정보 확인</h2>
      <p class="intro">방문 신청에 적은 성명과 본인 연락처를 입력하세요.</p>
      <form id="lookupForm" novalidate>
        <div class="field">
          <label for="visitorName">성명 <span class="required">*</span></label>
          <input id="visitorName" maxlength="80" autocomplete="name" placeholder="예: 홍길동">
        </div>
        <div class="field">
          <label for="phone">본인 연락처 <span class="required">*</span></label>
          <input id="phone" maxlength="20" inputmode="tel" autocomplete="tel">
        </div>
        <button id="lookupButton" class="submit" type="submit" disabled>승인 정보 확인</button>
      </form>
    </section>

    <section id="confirmCard" class="card hidden">
      <h2>방문 정보 확인</h2>
      <p class="intro">승인된 내용은 현장에서 수정할 수 없습니다. 내용이 다르면 입장하지 말고 담당자에게 문의하세요.</p>
      <div id="visitorDetails" class="details"></div>
      <div class="security-copy">회사 내 촬영·자료 반출·정보 유출 등 보안 위반 행위를 하지 않으며, 직원의 안내와 회사 보안수칙을 준수합니다.</div>
      <label class="check"><input id="securityConsent" type="checkbox"><span>위 방문 정보가 본인과 일치하며 방문객 보안수칙을 준수하겠습니다. <span class="required">*</span></span></label>
      <button id="entryButton" class="submit" type="button" disabled>입장 등록</button>
    </section>

    <section id="successCard" class="card success-card hidden">
      <div class="success-icon">✓</div>
      <h2>입장 등록 완료</h2>
      <p id="successText" class="intro"></p>
    </section>
  </main>
  <div id="overlay" class="overlay">처리 중입니다.</div>

  <script>
    const state = { ready: true, busy: false, visitor: null, credentials: null };
    const form = document.getElementById('lookupForm');
    form.addEventListener('submit', lookupVisitor);
    form.querySelectorAll('input').forEach((input) => input.addEventListener('input', updateButtons));
    document.getElementById('securityConsent').addEventListener('change', updateButtons);
    document.getElementById('entryButton').addEventListener('click', registerEntry);

    function initializeForm() {
      document.getElementById('statusDot').classList.add('ready');
      document.getElementById('systemStatus').textContent = '승인 방문객 등록 가능';
      updateButtons();
    }

    function lookupVisitor(event) {
      event.preventDefault();
      if (!state.ready || state.busy) return;
      const credentials = { name: valueOf('visitorName'), phone: valueOf('phone') };
      if (!credentials.name || !credentials.phone) return showError('성명과 본인 연락처를 입력하세요.');
      setBusy(true);
      clearMessage();
      google.script.run
        .withSuccessHandler((result) => {
          setBusy(false);
          state.visitor = result.visitor;
          state.credentials = credentials;
          renderVisitor(result.visitor);
        })
        .withFailureHandler((error) => { setBusy(false); showError(errorMessage(error)); })
        .getVisitorEntryEligibility(credentials);
    }

    function renderVisitor(visitor) {
      const fields = [
        ['성명', visitor.name],
        ['소속회사', visitor.organization],
        ['방문기간', visitor.visitStartDate + ' ~ ' + visitor.visitEndDate],
        ['방문목적', visitor.visitPurpose],
        ['방문대상', visitor.hostName],
        ['차량번호', visitor.vehicleNumber || '없음'],
        ['반입물품', visitor.carryItems || '없음'],
      ];
      document.getElementById('visitorDetails').innerHTML = fields.map((field) => '<div><small>' + escapeHtml(field[0]) + '</small><strong>' + escapeHtml(field[1]) + '</strong></div>').join('');
      document.getElementById('lookupCard').classList.add('hidden');
      document.getElementById('confirmCard').classList.remove('hidden');
      updateButtons();
    }

    function registerEntry() {
      if (!state.visitor || !state.credentials || !document.getElementById('securityConsent').checked || state.busy) return;
      setBusy(true);
      clearMessage();
      google.script.run
        .withSuccessHandler((result) => {
          setBusy(false);
          document.getElementById('confirmCard').classList.add('hidden');
          document.getElementById('successCard').classList.remove('hidden');
          document.getElementById('successText').textContent = result.name + ' 님 · ' + result.enteredAt;
          showMessage('입장 등록이 완료되었습니다.', 'success');
        })
        .withFailureHandler((error) => { setBusy(false); showError(errorMessage(error)); })
        .registerApprovedVisitorEntry({
          applicationNumber: state.visitor.applicationNumber,
          phone: state.credentials.phone,
          securityConsent: true,
        });
    }

    function updateButtons() {
      document.getElementById('lookupButton').disabled = state.busy || !state.ready || !valueOf('visitorName') || !valueOf('phone');
      document.getElementById('entryButton').disabled = state.busy || !state.visitor || !document.getElementById('securityConsent').checked;
    }
    function valueOf(id) { return document.getElementById(id).value.trim(); }
    function setBusy(busy) { state.busy = busy; clearTimeout(state.overlayTimer); const overlay = document.getElementById('overlay'); if (busy) { state.overlayTimer = setTimeout(() => overlay.classList.add('show'), 350); } else { overlay.classList.remove('show'); } updateButtons(); }
    function showError(text) { showMessage(text, 'error'); }
    function showMessage(text, type) { const box = document.getElementById('message'); box.textContent = text; box.className = 'message ' + type; window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function clearMessage() { const box = document.getElementById('message'); box.textContent = ''; box.className = 'message'; }
    function errorMessage(error) { return error && error.message ? error.message : String(error || '처리 중 오류가 발생했습니다.'); }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }

    initializeForm();
  </script>
</body>
</html>
