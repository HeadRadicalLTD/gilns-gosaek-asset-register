<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>길앤에스 통합 관리</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0eb;
      --surface: #ffffff;
      --blue: #316be8;
      --purple: #7656d8;
      --green: #16845b;
      --orange: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    .hidden { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #dce8ff 0, transparent 34%),
        linear-gradient(180deg, #f7f9fc 0%, #edf2f8 100%);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
    }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    .hero {
      overflow: hidden;
      position: relative;
      padding: 42px 44px;
      border-radius: 28px;
      background: #1e2b46;
      color: #fff;
      box-shadow: 0 20px 50px rgba(23, 32, 51, 0.16);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logout {
      position: relative;
      z-index: 1;
      display: inline-grid;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      place-items: center;
    }

    .hero-actions { display: flex; gap: 8px; }

    .role-badge {
      position: relative;
      z-index: 1;
      display: inline-grid;
      padding: 9px 13px;
      border-radius: 10px;
      background: rgba(155,184,255,.18);
      color: #dce7ff;
      font-size: 13px;
      font-weight: 900;
      place-items: center;
    }

    .password-panel {
      margin-top: 16px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(23,32,51,.06);
    }

    .password-panel h2 { margin: 0 0 14px; font-size: 20px; }
    .password-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .password-grid input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .password-save { width: 100%; min-height: 46px; margin-top: 12px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font: inherit; font-weight: 900; cursor: pointer; }
    .password-message { margin: 10px 0 0; color: #c83a3a; font-size: 13px; }

    .hero::after {
      position: absolute;
      top: -84px;
      right: -42px;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      content: "";
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #9bb8ff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      letter-spacing: -0.04em;
    }

    .hero p:last-child {
      max-width: 650px;
      margin: 16px 0 0;
      color: #d8e1f1;
      font-size: 16px;
      line-height: 1.7;
    }

    .section-title {
      margin: 38px 4px 18px;
      font-size: 20px;
    }

    .modules {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .module {
      display: flex;
      min-height: 260px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease;
      flex-direction: column;
    }

    .module:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(23, 32, 51, 0.13);
    }

    .number {
      display: grid;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      place-items: center;
    }

    .asset .number,
    .asset .open {
      background: var(--blue);
    }

    .info .number,
    .info .open {
      background: var(--purple);
    }

    .visitor .number,
    .visitor .open {
      background: var(--green);
    }

    .employee .number,
    .employee .open {
      background: var(--orange);
    }

    .movement .number,
    .movement .open {
      background: #0F766E;
    }

    .request .number,
    .request .open {
      background: #B54708;
    }

    .audit .number,
    .audit .open {
      background: #344054;
    }

    h2 {
      margin: 24px 0 10px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .open {
      margin-top: auto;
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 820px) {
      .modules {
        grid-template-columns: 1fr;
      }

      .module {
        min-height: 220px;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 24px, 1080px);
        padding: 18px 0 48px;
      }

      .hero {
        padding: 28px 24px;
        border-radius: 22px;
      }

      .section-title {
        margin-top: 28px;
      }

      .password-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-user-role="<?= userRole ?>" data-web-app-url="<?= webAppUrl ?>" data-admin-token="<?= adminToken ?>">
  <?!= getSharedBackgroundHtml_() ?>

        <div class="hero-actions">
          <span class="role-badge"><?= actorName ?> · <?= userRole === 'admin' ? '관리자' : '등록자' ?></span>
          <a class="logout" href="<?= webAppUrl ?>" target="_top">처음 페이지</a>
          <button id="changePasswordButton" class="logout <?= userRole === 'admin' ? '' : 'hidden' ?>" type="button">비밀번호 변경</button>
          <button id="logoutButton" class="logout" type="button">로그아웃</button>
        </div>
      </div>
      <h1><?= userRole === 'admin' ? '길앤에스 통합 관리' : '길앤에스 등록자 화면' ?></h1>
      <p>
        <?= userRole === 'admin'
          ? '실물·정보자산과 출입기록을 하나의 주소에서 관리합니다. 필요한 업무를 선택하세요.'
          : '실물·정보자산 등록, 기존 실물자산 수정, 방문객 등록, 부서 출입 신청과 관리 요청을 처리합니다.' ?>
      </p>
    </header>

    <section id="passwordPanel" class="password-panel hidden">
      <h2>관리자 비밀번호 변경</h2>
      <form id="passwordForm">
        <div class="password-grid">
          <input id="currentPassword" type="password" placeholder="현재 비밀번호" autocomplete="current-password" required>
          <input id="newPassword" type="password" placeholder="새 비밀번호 12자 이상" autocomplete="new-password" required>
          <input id="confirmPassword" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" required>
        </div>
        <button id="passwordSaveButton" class="password-save" type="submit">비밀번호 저장</button>
        <p id="passwordMessage" class="password-message"></p>
      </form>
    </section>

    <h2 class="section-title">업무 선택</h2>
    <section class="modules" aria-label="업무 선택">
      <a
        class="module asset"
        href="<?= webAppUrl ?>?module=asset&adminToken=<?= adminToken ?>"
        target="_top"
      >
        <span class="number">01</span>
        <h2><?= userRole === 'admin' ? '실물자산관리' : '실물자산 등록·수정' ?></h2>
        <p class="description">
          <?= userRole === 'admin'
            ? '자산정보와 증빙·실물 사진을 등록하고 기존 자산 및 물품 반출입을 관리합니다.'
            : '신규 실물자산을 등록하고 기존 실물자산의 기본 정보와 사진을 수정합니다.' ?>
        </p>
        <span class="open"><?= userRole === 'admin' ? '실물자산관리 열기' : '실물자산 등록·수정 열기' ?></span>
      </a>

      <a
        class="module info"
        href="<?= webAppUrl ?>?module=info&adminToken=<?= adminToken ?>"
        target="_top"
      >
        <span class="number">02</span>
        <h2><?= userRole === 'admin' ? '정보자산관리' : '정보자산 등록' ?></h2>
        <p class="description">
          <?= userRole === 'admin'
            ? '장비·소프트웨어·계정·데이터의 담당자, 보안등급, 상태와 만료일을 관리합니다.'
            : '장비·소프트웨어·계정·데이터를 신규 등록합니다.' ?>
        </p>
        <span class="open"><?= userRole === 'admin' ? '정보자산관리 열기' : '정보자산 등록 열기' ?></span>
      </a>

      <a
        class="module visitor"
        href="<?= webAppUrl + '?module=visitor&adminToken=' + adminToken ?>"
        target="_top"
      >
        <span class="number">03</span>
        <h2><?= userRole === 'admin' ? '외부 방문객 관리' : '외부 방문객 등록' ?></h2>
        <p class="description">
          <?= userRole === 'admin'
            ? '방문객의 입장 정보를 기록하고 현재 방문객을 확인해 퇴장 처리합니다.'
            : '방문객이 휴대폰으로 현장 등록할 수 있는 QR 화면을 엽니다.' ?>
        </p>
        <span class="open"><?= userRole === 'admin' ? '외부 방문객 관리 열기' : '방문객 등록 QR 열기' ?></span>
      </a>

      <a
        class="module employee"
        href="<?= webAppUrl ?>?module=employee&adminToken=<?= adminToken ?>"
        target="_top"
      >
        <span class="number">04</span>
        <h2><?= userRole === 'admin' ? '부서 출입 관리' : '부서 출입 신청' ?></h2>
        <p class="description">
          <?= userRole === 'admin'
            ? '타 부서 보호구역 출입 신청과 부서별 승인·반려를 관리합니다.'
            : '타 부서 보호구역 출입을 신청하고 본인의 신청 상태를 확인합니다.' ?>
        </p>
        <span class="open"><?= userRole === 'admin' ? '부서 출입 관리 열기' : '부서 출입 신청 열기' ?></span>
      </a>

      <a
        class="module movement"
        href="<?= webAppUrl ?>?module=movement&adminToken=<?= adminToken ?>"
        target="_top"
      >
        <span class="number">05</span>
        <h2><?= userRole === 'admin' ? '물품 반출입 관리' : '물품 반출입 신청' ?></h2>
        <p class="description"><?= userRole === 'admin' ? '반출 신청을 승인·반려하고 반입 완료까지 관리합니다.' : '물품 반출을 신청하고 내 신청 상태를 확인합니다.' ?></p>
        <span class="open"><?= userRole === 'admin' ? '물품 반출입 관리 열기' : '물품 반출입 신청 열기' ?></span>
      </a>

      <a
        class="module request"
        href="<?= webAppUrl ?>?module=requests&adminToken=<?= adminToken ?>"
        target="_top"
      >
        <span class="number">06</span>
        <h2>관리 요청</h2>
        <p class="description"><?= userRole === 'admin' ? '삭제·정정 요청을 확인하고 승인 또는 반려합니다.' : '직접 처리할 수 없는 삭제·정정을 관리자에게 요청합니다.' ?></p>
        <span class="open">관리 요청 열기</span>
      </a>

      <? if (userRole === 'admin') { ?>
      <a
        class="module audit"
        href="<?= webAppUrl ?>?module=audit&adminToken=<?= adminToken ?>"
        target="_top"
      >
        <span class="number">07</span>
        <h2>감사로그 열람</h2>
        <p class="description">실물자산·출입·반출입·정보자산의 변경 불가 로그를 읽기 전용으로 확인합니다.</p>
        <span class="open">감사로그 열기</span>
      </a>
      <? } ?>
    </section>
  </main>
  <script>
    const WEB_APP_URL = '<?= webAppUrl ?>';
    const ADMIN_TOKEN = '<?= adminToken ?>';
    gilnsProtectSessionUrl(ADMIN_TOKEN, {});

    document.getElementById('logoutButton')
      .addEventListener('click', () => {
        google.script.run
          .withSuccessHandler((result) => {
            sessionStorage.removeItem('gilns-admin-token');
            window.top.location.replace(result.redirectUrl);
          })
          .adminLogout(ADMIN_TOKEN);
      });

    document.getElementById('changePasswordButton')
      .addEventListener('click', () => {
        document.getElementById('passwordPanel')
          .classList.toggle('hidden');
      });

    document.getElementById('passwordForm')
      .addEventListener('submit', (event) => {
        event.preventDefault();
        const current = document.getElementById('currentPassword').value;
        const next = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const message = document.getElementById('passwordMessage');
        const button = document.getElementById('passwordSaveButton');

        if (next !== confirm) {
          message.textContent = '새 비밀번호가 서로 다릅니다.';
          return;
        }

        button.disabled = true;
        message.textContent = '';
        google.script.run
          .withSuccessHandler(() => {
            button.disabled = false;
            document.getElementById('passwordForm').reset();
            message.style.color = '#16845b';
            message.textContent = '관리자 비밀번호를 변경했습니다.';
          })
          .withFailureHandler((error) => {
            button.disabled = false;
            message.style.color = '#c83a3a';
            message.textContent = error && error.message
              ? error.message
              : '비밀번호를 변경하지 못했습니다.';
          })
          .changeAdminPassword(ADMIN_TOKEN, current, next);
      });
  </script>
</body>
</html>
