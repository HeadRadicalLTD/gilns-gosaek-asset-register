<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>관리 요청</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d8deea;--accent:#b54708;--blue:#316be8;--green:#087a55;--red:#c43232}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.shell{width:min(1060px,calc(100% - 28px));margin:auto;padding:24px 0 64px}.hero,.card{border:1px solid rgba(216,222,234,.9);border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 14px 36px rgba(23,32,51,.09)}.hero{padding:28px}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{color:#344054;font-weight:900;text-decoration:none}.eyebrow{margin:20px 0 8px;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.12em}h1{margin:0;font-size:clamp(32px,6vw,48px)}.hero p:last-child{color:var(--muted)}.card{margin-top:16px;padding:24px}.card h2{margin:0 0 6px}.card-intro{margin:0 0 18px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;margin-bottom:6px;font-weight:800}input,select,textarea{width:100%;min-height:48px;padding:11px 13px;border:1px solid #cbd3e2;border-radius:11px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}.lookup{display:grid;grid-template-columns:1fr auto;gap:8px}.lookup button,.submit,.action,.open-edit{border:0;border-radius:11px;color:#fff;font-weight:900;cursor:pointer}.lookup button{padding:0 18px;background:#263856}.submit{width:100%;min-height:52px;margin-top:16px;background:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.results{display:grid;gap:8px;margin-top:10px}.result{display:flex;justify-content:space-between;gap:14px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer}.result:hover,.result:focus-visible{border-color:var(--blue);background:#f4f7ff}.result span{color:var(--muted);font-size:13px}.selected{padding:12px;border:1px solid #a9c5ff;border-radius:12px;background:#f2f6ff;color:#214caa;font-weight:800}.message{display:none;margin-top:14px;padding:13px;border-radius:11px}.message.show{display:block}.error{background:#fff1f1;color:var(--red)}.success{background:#eef9f3;color:var(--green)}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select{min-height:42px}.requests{display:grid;gap:12px}.request{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.request-head{display:flex;justify-content:space-between;gap:12px}.request h3{margin:0}.status{padding:5px 9px;border-radius:999px;background:#f2f4f7;font-size:12px;font-weight:900}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;color:var(--muted);font-size:13px}.reason{padding:12px;border-radius:10px;background:#f8f9fc}.decision{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}.approve{background:var(--green)}.reject{background:var(--red)}.action{padding:0 16px}.open-edit{min-height:50px;padding:0 18px;background:var(--blue)}.empty{padding:28px;color:var(--muted);text-align:center}.overlay{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;background:rgba(23,32,51,.42);color:#fff;font-size:18px;font-weight:900}.overlay.show{display:flex}@media(max-width:700px){.grid,.meta{grid-template-columns:1fr}.full{grid-column:auto}.decision{grid-template-columns:1fr 1fr}.decision textarea{grid-column:1/-1}.hero,.card{padding:20px}.lookup{grid-template-columns:1fr}.toolbar{flex-direction:column}.result{flex-direction:column}}
  </style>
</head>
<body data-admin-token="<?= adminToken ?>" data-user-role="<?= userRole ?>" data-actor-name="<?= actorName ?>" data-web-app-url="<?= webAppUrl ?>" data-current-module="requests">
  <?!= getSharedBackgroundHtml_() ?>
  <main class="shell">
    <header class="hero">
      <nav class="nav"><a href="<?= webAppUrl ?>?adminToken=<?= adminToken ?>" target="_top">통합 메뉴</a><strong><?= actorName ?> · <?= userRole === 'admin' ? '관리자' : '등록자' ?></strong></nav>
      <p class="eyebrow">CONTROLLED REQUEST</p><h1>관리 요청</h1>
      <p><?= userRole === 'admin' ? '관리자는 자산을 직접 수정하고, 등록자가 보낸 삭제·정정 요청을 처리합니다.' : '자산명 또는 품목으로 대상을 찾은 뒤 관리자에게 삭제·정정을 요청합니다.' ?></p>
    </header>
    <div id="errorMessage" class="message error"></div><div id="successMessage" class="message success"></div>

    <section id="registrarRequestCard" class="card">
      <h2>새 요청 등록</h2><p class="card-intro">관리할 자산을 검색하여 선택하면 관리번호가 자동으로 연결됩니다.</p>
      <form id="requestForm">
        <div class="grid">
          <div><label for="assetSheet">등록된 시트</label><select id="assetSheet" required></select></div>
          <div><label for="requestType">요청 구분</label><select id="requestType" required><option value="">선택하세요</option></select></div>
          <div class="full"><label for="assetQuery">자산명 또는 품목</label><div class="lookup"><input id="assetQuery" type="search" maxlength="100" placeholder="예: 핸드폰거치대"><button id="assetSearchButton" type="button">자산 검색</button></div><div id="assetResults" class="results"></div></div>
          <input id="targetId" type="hidden"><input id="targetName" type="hidden">
          <div id="selectedAsset" class="selected full" hidden></div>
          <div class="full"><label for="reason">요청 사유</label><textarea id="reason" maxlength="500" required></textarea></div>
        </div>
        <button id="submitButton" class="submit" type="submit" disabled>관리자에게 요청</button>
      </form>
    </section>

    <section id="adminEditCard" class="card" hidden>
      <h2>자산 직접 수정</h2><p class="card-intro">관리자는 요청을 새로 등록하지 않고 자산을 검색해 정보와 사진을 직접 수정합니다.</p>
      <div class="grid"><div><label for="adminAssetSheet">등록된 시트</label><select id="adminAssetSheet"></select></div><div><label for="adminAssetQuery">자산명 또는 품목</label><div class="lookup"><input id="adminAssetQuery" type="search" maxlength="100" placeholder="예: 핸드폰거치대"><button id="adminAssetSearchButton" type="button">자산 검색</button></div></div><div id="adminAssetResults" class="results full"></div></div>
    </section>

    <section class="card">
      <h2><?= userRole === 'admin' ? '등록자 요청 관리' : '내 요청 내역' ?></h2>
      <div class="toolbar"><select id="statusFilter"><option value="">전체 상태</option><option value="처리 대기">처리 대기</option><option value="처리 완료">처리 완료</option><option value="반려">반려</option></select><input id="requestFilter" type="search" placeholder="자산명·요청자·요청번호 검색"></div>
      <div id="requests" class="requests"><div class="empty">요청 내역을 불러오는 중입니다.</div></div>
    </section>
  </main>
  <div id="overlay" class="overlay">처리 중입니다.</div>
  <script>
    const ADMIN_TOKEN=document.body.dataset.adminToken;
    const WEB_APP_URL=document.body.dataset.webAppUrl;
    const IS_ADMIN=document.body.dataset.userRole==='admin';
    gilnsProtectSessionUrl(ADMIN_TOKEN,{module:'requests'});
    const state={busy:false,ready:false,requests:[],sheets:[],selectedAsset:null};
    const form=document.getElementById('requestForm');
    form.addEventListener('input',updateButton);form.addEventListener('change',updateButton);form.addEventListener('submit',submitRequest);
    document.getElementById('assetSearchButton').addEventListener('click',()=>searchAssets('registrar'));
    document.getElementById('adminAssetSearchButton').addEventListener('click',()=>searchAssets('admin'));
    document.getElementById('requestType').addEventListener('change',()=>{clearSelectedAsset();document.getElementById('assetResults').innerHTML='';});
    document.getElementById('assetQuery').addEventListener('keydown',(event)=>{if(event.key==='Enter'){event.preventDefault();searchAssets('registrar');}});
    document.getElementById('adminAssetQuery').addEventListener('keydown',(event)=>{if(event.key==='Enter'){event.preventDefault();searchAssets('admin');}});
    document.getElementById('assetSheet').addEventListener('change',clearSelectedAsset);
    document.getElementById('statusFilter').addEventListener('change',renderRequests);
    document.getElementById('requestFilter').addEventListener('input',renderRequests);

    function load(){google.script.run.withSuccessHandler((config)=>{if(!config.ok){showError(config.message);return;}state.ready=true;state.requests=config.requests||[];state.sheets=config.assetSheets||[];fillSelect('assetSheet',state.sheets,config.defaultAssetSheet);fillSelect('adminAssetSheet',state.sheets,config.defaultAssetSheet);document.getElementById('requestType').innerHTML='<option value="">선택하세요</option>'+config.requestTypes.map((value)=>'<option value="'+escapeHtml(value)+'">'+escapeHtml(value)+'</option>').join('');document.getElementById('registrarRequestCard').hidden=IS_ADMIN;document.getElementById('adminEditCard').hidden=!IS_ADMIN;renderRequests();updateButton();}).withFailureHandler((error)=>showError(messageOf(error))).getManagementRequestConfig(ADMIN_TOKEN);}
    function fillSelect(id,values,selected){const select=document.getElementById(id);select.innerHTML=(values||[]).map((value)=>'<option value="'+escapeHtml(value)+'"'+(value===selected?' selected':'')+'>'+escapeHtml(value)+'</option>').join('');}
    function searchAssets(kind){if(state.busy)return;const admin=kind==='admin';const query=value(admin?'adminAssetQuery':'assetQuery');const sheet=value(admin?'adminAssetSheet':'assetSheet');if(!query){showError('자산명 또는 품목을 입력하세요.');return;}setBusy(true);clearMessages();const success=(result)=>{setBusy(false);renderAssetResults(kind,result.results||[]);};const failure=(error)=>{setBusy(false);showError(messageOf(error));};const runner=google.script.run.withSuccessHandler(success).withFailureHandler(failure);if(!admin&&value('requestType')==='정보자산 삭제'){runner.searchInfoAssetsForRequest(query,ADMIN_TOKEN);}else{runner.searchAssetsForEdit(sheet,query,ADMIN_TOKEN);}}
    function renderAssetResults(kind,results){const admin=kind==='admin';const target=document.getElementById(admin?'adminAssetResults':'assetResults');target.innerHTML='';if(!results.length){target.innerHTML='<div class="empty">일치하는 자산이 없습니다.</div>';return;}results.forEach((asset)=>{if(asset.assetId&&!asset.managementNumber)asset.managementNumber=asset.assetId;const button=document.createElement('button');button.type='button';button.className='result';button.innerHTML='<strong>'+escapeHtml(asset.itemName||'이름 없음')+'</strong><span>'+escapeHtml(asset.assetId?'정보자산 번호 ':'관리번호 ')+escapeHtml(asset.managementNumber)+(asset.modelMaker?' · '+escapeHtml(asset.modelMaker):'')+'</span>';button.addEventListener('click',()=>admin?openAssetEditor(asset):selectRequestAsset(asset));target.appendChild(button);});}
    function selectRequestAsset(asset){state.selectedAsset=asset;document.getElementById('targetId').value=asset.managementNumber;document.getElementById('targetName').value=asset.itemName||'';const selected=document.getElementById('selectedAsset');selected.hidden=false;selected.textContent='선택됨 · '+asset.itemName+' · 관리번호 '+asset.managementNumber;document.getElementById('assetResults').innerHTML='';updateButton();}
    function clearSelectedAsset(){state.selectedAsset=null;document.getElementById('targetId').value='';document.getElementById('targetName').value='';document.getElementById('assetResults').innerHTML='';document.getElementById('selectedAsset').hidden=true;updateButton();}
    function openAssetEditor(asset){const url=WEB_APP_URL+'?module=asset&adminToken='+encodeURIComponent(ADMIN_TOKEN)+'&mode=edit&sheet='+encodeURIComponent(value('adminAssetSheet'))+'&asset='+encodeURIComponent(asset.managementNumber);window.top.location.href=url;}
    function submitRequest(event){event.preventDefault();if(state.busy||!ready())return;setBusy(true);clearMessages();google.script.run.withSuccessHandler((result)=>{setBusy(false);state.requests=result.requests||[];form.reset();fillSelect('assetSheet',state.sheets,state.sheets[0]||'');clearSelectedAsset();showSuccess(result.requestId+' 요청 접수 완료');renderRequests();updateButton();}).withFailureHandler((error)=>{setBusy(false);showError(messageOf(error));}).registerManagementRequest({adminToken:ADMIN_TOKEN,requestType:value('requestType'),targetSheetName:value('assetSheet'),targetId:value('targetId'),targetName:value('targetName'),reason:value('reason')});}
    function decide(id,action,button){const box=button.closest('.request');const note=box.querySelector('.decision-note').value.trim();if(!note){showError('처리 메모를 입력하세요.');return;}if(!confirm(action==='approve'?'이 요청을 승인할까요?':'이 요청을 반려할까요?'))return;setBusy(true);clearMessages();google.script.run.withSuccessHandler((result)=>{setBusy(false);state.requests=result.requests||[];showSuccess(result.requestId+' '+result.status+' 처리 완료');renderRequests();}).withFailureHandler((error)=>{setBusy(false);showError(messageOf(error));}).processManagementRequest({adminToken:ADMIN_TOKEN,requestId:id,action:action,note:note});}
    function openRequestTarget(request){let url=WEB_APP_URL+'?adminToken='+encodeURIComponent(ADMIN_TOKEN);if(request.requestType.indexOf('실물자산')===0){const match=request.targetName.match(/^\[([^\]]+)\]/);url+='&module=asset&mode=edit&sheet='+encodeURIComponent(match?match[1]:'')+'&asset='+encodeURIComponent(request.targetId);}else if(request.requestType.indexOf('정보자산')===0){url+='&module=info';}else if(request.requestType.indexOf('반출입')===0){url+='&module=movement';}window.open(url,'_blank','noopener');const execute=document.querySelector('[data-execute="'+CSS.escape(request.requestId)+'"]');if(execute)execute.hidden=false;}
    function executeDeletion(requestId){if(!confirm('대상과 백업을 다시 확인했습니다. 실제 삭제를 실행할까요? 삭제 후에는 백업 파일로만 복구할 수 있습니다.'))return;setBusy(true);clearMessages();google.script.run.withSuccessHandler((result)=>{setBusy(false);state.requests=result.requests||[];showSuccess(result.requestId+' 삭제 완료 · 백업도 생성했습니다.');renderRequests();}).withFailureHandler((error)=>{setBusy(false);showError(messageOf(error));}).executeManagementDeletion({adminToken:ADMIN_TOKEN,requestId:requestId,confirmation:'DELETE_CONFIRMED'});}
    function renderRequests(){const status=value('statusFilter');const keyword=value('requestFilter').toLowerCase();const rows=state.requests.filter((request)=>(!status||request.status===status)&&(!keyword||[request.requestId,request.requestType,request.targetId,request.targetName,request.requester].join(' ').toLowerCase().includes(keyword)));const target=document.getElementById('requests');if(!rows.length){target.innerHTML='<div class="empty">조건에 맞는 요청이 없습니다.</div>';return;}target.innerHTML=rows.map((request)=>{const deletion=['실물자산 삭제','정보자산 삭제'].includes(request.requestType);const controls=IS_ADMIN&&request.status==='처리 대기'?(deletion?'<div class="actions"><button class="open-edit" type="button" data-open="'+escapeHtml(request.requestId)+'">1. 대상 열기·확인</button><button class="action reject" type="button" data-execute="'+escapeHtml(request.requestId)+'" hidden>2. 삭제 실행</button></div><div class="decision"><textarea class="decision-note" maxlength="500" placeholder="반려 사유"></textarea><span></span><button class="action reject" type="button" data-action="reject" data-id="'+escapeHtml(request.requestId)+'">반려</button></div>':'<div class="actions"><button class="open-edit" type="button" data-open="'+escapeHtml(request.requestId)+'">1. 처리 화면 열기</button></div><div class="decision"><textarea class="decision-note" maxlength="500" placeholder="실제 수정 후 처리 메모"></textarea><button class="action approve" type="button" data-action="approve" data-id="'+escapeHtml(request.requestId)+'">2. 처리 완료</button><button class="action reject" type="button" data-action="reject" data-id="'+escapeHtml(request.requestId)+'">반려</button></div>') : '';return ['<article class="request" data-request="',escapeHtml(request.requestId),'"><div class="request-head"><div><h3>',escapeHtml(request.requestType),' · ',escapeHtml(request.targetName||request.targetId),'</h3><small>',escapeHtml(request.requestId),' · 대상번호 ',escapeHtml(request.targetId),'</small></div><span class="status">',escapeHtml(request.status),'</span></div><div class="meta"><span>요청자 ',escapeHtml(request.requester),' (',escapeHtml(request.requesterRole),')</span><span>',escapeHtml(request.requestedAt),'</span><span>',escapeHtml(request.targetName),'</span></div><div class="reason">',escapeHtml(request.reason),'</div>',request.processedBy?'<div class="meta"><span>처리자 '+escapeHtml(request.processedBy)+'</span><span>'+escapeHtml(request.processedAt)+'</span><span>'+escapeHtml(request.note)+'</span></div>':'',controls,'</article>'].join('');}).join('');target.querySelectorAll('[data-action]').forEach((button)=>button.addEventListener('click',()=>decide(button.dataset.id,button.dataset.action,button)));target.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openRequestTarget(state.requests.find(r=>r.requestId===button.dataset.open))));target.querySelectorAll('[data-execute]').forEach(button=>button.addEventListener('click',()=>executeDeletion(button.dataset.execute)));}
    function ready(){return ['assetSheet','requestType','targetId','reason'].every((id)=>value(id));}function updateButton(){document.getElementById('submitButton').disabled=state.busy||!state.ready||!ready();}function setBusy(value){state.busy=value;document.getElementById('overlay').classList.toggle('show',value);updateButton();}function value(id){return document.getElementById(id).value.trim();}function clearMessages(){['errorMessage','successMessage'].forEach((id)=>document.getElementById(id).classList.remove('show'));}function showError(text){const element=document.getElementById('errorMessage');element.textContent=text;element.classList.add('show');}function showSuccess(text){const element=document.getElementById('successMessage');element.textContent=text;element.classList.add('show');}function messageOf(error){return error&&error.message?error.message:String(error||'처리 중 오류가 발생했습니다.');}function escapeHtml(text){return String(text==null?'':text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}load();
  </script>
</body>
</html>
