<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="robots" content="noindex, nofollow">
  <title>길앤에스 휴대폰 촬영 연결</title>
  <style>
    :root {
      color-scheme: light;
      font-family:
        Pretendard, "Noto Sans KR", Arial, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f3f6fb;
      color: #172033;
    }

    main {
      width: min(88vw, 420px);
      padding: 32px 24px;
      border: 1px solid #dce4f0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 44px rgb(26 52 92 / 10%);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    p {
      margin: 0 0 22px;
      color: #5b667a;
      line-height: 1.7;
    }

    a {
      display: none;
      padding: 14px 18px;
      border-radius: 14px;
      background: #246bfe;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <h1>휴대폰 촬영 화면 연결 중</h1>
    <p id="message">
      잠시만 기다려 주세요.
    </p>
    <a id="continueLink" href="#">
      촬영 화면 열기
    </a>
  </main>

  <script>
    (() => {
      const APP_URL =
        'https://script.google.com/macros/s/' +
        'AKfycbwRjRFFFj6FKGDV96Qol59PXvfGvzzFLHmw5eVoBNA8IMIFM2A8TOkHt74dB5yvrH0c' +
        '/exec';
      const message = document.getElementById('message');
      const link = document.getElementById('continueLink');
      const parameters = new URLSearchParams(
        window.location.hash.slice(1)
      );
      const capture = parameters.get('capture') || '';
      const token = parameters.get('token') || '';

      if (
        !/^[A-Za-z0-9]{10,80}$/.test(capture) ||
        !/^[A-Za-z0-9-]{20,160}$/.test(token)
      ) {
        message.textContent =
          '연결 정보가 올바르지 않습니다. ' +
          'PC에서 QR을 다시 만들어 주세요.';
        return;
      }

      const target =
        APP_URL +
        '?capture=' + encodeURIComponent(capture) +
        '&token=' + encodeURIComponent(token);

      history.replaceState(
        null,
        '',
        window.location.pathname
      );
      link.href = target;
      link.classList.add('show');
      message.textContent =
        '자동으로 이동하지 않으면 아래 버튼을 누르세요.';

      window.setTimeout(() => {
        window.location.replace(target);
      }, 250);
    })();
  </script>
</body>
</html>
